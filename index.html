function baseHP(){return Math.max(1,Math.floor(10*Math.pow(1.5,Math.floor(state.normalMonstersKilled/10))))}function spawnMonster(){const elite=state.elitePending;state.elitePending=false;state.monsterIsElite=elite;state.monsterIndex=(state.monsterIndex+1)%MONSTERS.length;const type=currentEnemyType(),factor=type.id==='swarm'?2.2:type.id==='regen'?1.25:type.id==='bounty'?1.5:type.id==='armored'?1.15:1;state.monsterMaxHP=Math.max(1,baseHP()*(elite?3:1)*factor);state.monsterHP=state.monsterMaxHP;state.monsterArmorHits=0;state.monsterArmorBroken=false}function defeatMonster(x,y){const elite=state.monsterIsElite,type=currentEnemyType(),now=Date.now();state.killStreak=now-state.lastMonsterKillTime<=4000?state.killStreak+1:1;state.lastMonsterKillTime=now;const streakBonus=1+Math.min(.5,Math.max(0,state.killStreak-1)*.05),bounty=type.id==='bounty'?3:1,reward=Math.floor(state.monsterMaxHP*(elite?5:1)*bounty*goldMultiplier()*streakBonus);addGold(reward);state.monstersKilled++;if(!elite){state.normalMonstersKilled++;if(++state.normalKillsSinceElite>=10){state.normalKillsSinceElite=0;state.elitePending=true}}const r=E.battle.getBoundingClientRect(),fx=Number.isFinite(x)?x:r.left+r.width/2,fy=Number.isFinite(y)?y:r.top+r.height/2,chain=state.killStreak>1?` · 连斩×${formatNumber(state.killStreak)}`:'';floatText(fx,fy,`+${formatNumber(reward)} 🪙${chain}`,false,false,true);spawnBurst(fx,fy,elite);E.battle.classList.remove('killfx');void E.battle.offsetWidth;E.battle.classList.add('killfx');setTimeout(()=>E.battle.classList.remove('killfx'),240);shakeScreen(elite?2:1.35);spawnMonster();checkMilestones()}
function autoDamage(){let damage=autoDPS()*(1+state.permanentDamageBonus);if(damage<=0)return;if(state.bossActive){state.bossHP=Math.max(0,state.bossHP-damage);if(state.bossHP<=0)finishBoss(true);return}const type=currentEnemyType();if(type.id==='armored'&&!state.monsterArmorBroken)damage*=Math.max(.25,.6-.1*state.armorBreakLevel);state.monsterHP-=damage;if(state.monsterHP<=0)defeatMonster()}
function showBanner(t,s,d=2200){clearTimeout(bannerTimer);E.bannerText.textContent=t;E.bannerSub.textContent=s;E.banner.hidden=false;bannerTimer=setTimeout(()=>E.banner.hidden=true,d)}function startBoss(){state.bossActive=true;const power=autoDPS()||state.attack;state.bossMaxHP=Math.max(100,Math.floor(power*30*1.2));state.bossHP=state.bossMaxHP;state.bossTimerRemaining=30;showBanner('BOSS 来袭！','限时 30 秒，点击继续出拳',1300);renderAll()}function finishBoss(win){if(!state.bossActive)return;state.bossActive=false;state.bossTimerRemaining=0;state.bossHP=0;state.nextBossIn=300;if(win){state.bossKills++;state.permanentDamageBonus+=.1;showBanner('Boss 击破！永久伤害 +10%','伤害加成永久生效',2400)}else showBanner('Boss 时间到','没有惩罚，300 秒后再次挑战');checkMilestones();renderAll();save()}
function tick(){state.totalPlaySeconds++;if(!state.bossActive){const type=currentEnemyType();if(type.id==='regen'&&Date.now()-state.lastManualHitTime>2500)state.monsterHP=Math.min(state.monsterMaxHP,state.monsterHP+state.monsterMaxHP*.03)}if(state.bossActive){autoDamage();if(state.bossActive){state.bossTimerRemaining=Math.max(0,state.bossTimerRemaining-1);if(state.bossTimerRemaining===0)finishBoss(false)}}else{autoDamage();if(!state.bossActive&&--state.nextBossIn<=0){state.nextBossIn=0;startBoss()}}checkMilestones();renderAll();if(state.totalPlaySeconds%10===0)save()}
function comboHit(){const now=Date.now(),already=now<state.rageUntil;let finisher=false,activated=false;if(!already){if(state.lastClickTime&&now-state.lastClickTime>comboWindow())state.comboCount=0;state.comboCount++;if(state.comboCount>=comboTarget()){if(now>=state.rageCooldownUntil){state.comboCount=0;state.rageUntil=now+RAGE;state.rageCooldownUntil=now+COOLDOWN;state.rageTriggers++;finisher=true;activated=true;if(state.rageTriggers===1)checkMilestones();else toast('终结技！','暴怒状态已启动');}else state.comboCount=comboTarget()-1}}state.lastClickTime=now;if(activated)save();return{raging:already,finisher}}
// iOS Safari 不支持 Vibration API；若由 WKWebView 宿主注册 hapticFeedback 消息处理器，则走原生触感反馈桥接。
function triggerHaptic(kind='tap'){
  try{
    const handler=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.hapticFeedback;
    if(handler&&typeof handler.postMessage==='function'){handler.postMessage(kind);return true;}
  }catch(e){}
  try{
    if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function'){
      const patterns={tap:10,rage:18,critical:[12,18,32],kill:[18,12,30],finisher:[24,12,38]};
      return navigator.vibrate(patterns[kind]||patterns.tap);
    }
  }catch(e){}
  return false;
}
function playSound(kind){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioContext)audioContext=new C();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});const t=audioContext.currentTime;function tone(f0,f1,dur,vol,type='triangle',delay=0){const o=audioContext.createOscillator(),g=audioContext.createGain(),start=t+delay;o.type=type;o.frequency.setValueAtTime(f0,start);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),start+dur);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.008);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(audioContext.destination);o.start(start);o.stop(start+dur+.02)}const p=kind==='kill'?[105,38,.19,.085]:kind==='critical'?[210,58,.16,.07]:kind==='rage'?[150,48,.13,.06]:[125,55,.085,.045];tone(p[0],p[1],p[2],p[3],kind==='critical'?'sawtooth':'triangle');if(kind==='critical')tone(620,280,.12,.027,'sine',.015);if(kind==='kill')tone(560,980,.12,.032,'sine',.035)}catch(e){}}function attackAt(x,y){const combo=comboHit(),rage=combo.raging,finisher=combo.finisher,crit=Math.random()<state.critChance;state.lastManualHitTime=Date.now();const armorWasBroken=state.monsterArmorBroken;let damage=state.attack*(1+state.permanentDamageBonus)*(crit?critMultiplier():1)*(rage?rageMultiplier():1)*(finisher?3:1);if(!state.bossActive)damage=applyManualDamage(damage,crit,finisher);const brokeArmor=!armorWasBroken&&state.monsterArmorBroken,lethal=state.bossActive?damage>=state.bossHP:damage>=state.monsterHP,kind=finisher?'finisher':lethal?'kill':crit?'critical':rage?'rage':'tap';triggerHaptic(kind);playSound(kind==='finisher'?'kill':kind);spawnRing(x,y,crit||finisher);state.highestSingleHit=Math.max(state.highestSingleHit,damage);const prefix=`${finisher?'终结技 ':''}${brokeArmor?'破甲 ':''}${rage?'暴怒 ':''}${crit?'暴击 ':''}`;floatText(x,y,`${prefix}${formatNumber(damage)}`,crit||finisher,rage||finisher);if(finisher)shakeScreen(2.4);else if(crit)shakeScreen(1.6);if(state.bossActive){state.bossHP=Math.max(0,state.bossHP-damage);if(state.bossHP<=0)finishBoss(true)}else{state.monsterHP-=damage;if(state.monsterHP<=0)defeatMonster(x,y)}checkMilestones();renderAll()}
function showOffline(){if(!state.offlineClaimPending||state.lastOfflineGold<=0)return;E.offlineText.textContent=`离线 ${offlineDuration(state.lastOfflineSeconds)}，获得以下金币。`;E.offlineGold.textContent=`${formatNumber(state.lastOfflineGold)} 🪙`;E.offline.hidden=false}function processOffline(){const now=Date.now(),secs=Math.max(0,Math.floor((now-state.lastSaveTime)/1000));if(secs>30&&autoDPS()>0){const elapsed=Math.min(secs,MAX_OFFLINE),gain=Math.floor(autoDPS()*elapsed*.5);if(gain>0){if(!state.offlineClaimPending){state.lastOfflineGold=0;state.lastOfflineSeconds=0}state.lastOfflineGold+=gain;state.lastOfflineSeconds+=elapsed;state.offlineClaimPending=true}}state.lastSaveTime=now;if(state.offlineClaimPending)showOffline();save()}
function exportSave(){const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='one-punch-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importSave(file){try{const parsed=JSON.parse(await file.text()),data=parsed&&parsed.state&&typeof parsed.state==='object'?parsed.state:parsed;if(!data||typeof data!=='object'||!('attack'in data))throw Error('文件中没有有效游戏状态');if(!confirm('导入会覆盖当前进度，确定继续吗？'))return;replaceState(data);state.lastSaveTime=Date.now();renderAll();save();checkMilestones();if(state.offlineClaimPending)showOffline();else E.offline.hidden=true;toast('导入成功','存档已载入并保存到本设备。')}catch(e){alert(`无法导入存档：${e.message}`)}}
function frame(now){if(document.hidden){lastTick=now;requestAnimationFrame(frame);return}acc+=Math.max(0,(now-lastTick)/1000);lastTick=now;while(acc>=1){tick();acc-=1}visualFrame(now);requestAnimationFrame(frame)}
E.battle.addEventListener('pointerdown',e=>{e.preventDefault();attackAt(e.clientX,e.clientY)},{passive:false});E.battle.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const r=E.battle.getBoundingClientRect();attackAt(r.left+r.width/2,r.top+r.height/2)}});E.upAttack.addEventListener('click',()=>buy('attack'));E.upCrit.addEventListener('click',()=>buy('crit'));E.upAuto.addEventListener('click',()=>buy('auto'));E.critDmgButton.addEventListener('click',()=>buy('critDamage'));E.goldButton.addEventListener('click',()=>buy('gold'));E.rageButton.addEventListener('click',()=>buy('rage'));E.comboButton.addEventListener('click',()=>buy('combo'));E.armorButton.addEventListener('click',()=>buy('armor'));$('#buyMode').addEventListener('click',()=>{allInMode=!allInMode;renderUpgrades()});E.soundToggle.addEventListener('click',()=>{soundEnabled=!soundEnabled;E.soundToggle.textContent=soundEnabled?'🔊':'🔇';E.soundToggle.setAttribute('aria-label',soundEnabled?'关闭音效':'开启音效');E.soundToggle.setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled)playSound('tap')});$('#export').addEventListener('click',exportSave);$('#import').addEventListener('click',()=>$('#file').click());$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(f)await importSave(f);e.target.value=''});$('#claim').addEventListener('click',()=>{const g=state.lastOfflineGold;addGold(g);state.lastOfflineGold=0;state.lastOfflineSeconds=0;state.offlineClaimPending=false;E.offline.hidden=true;checkMilestones();renderAll();save()});
document.addEventListener('visibilitychange',()=>{if(!ready)return;if(document.hidden){lastTick=performance.now();acc=0;save()}else{lastTick=performance.now();acc=0;processOffline();renderAll()}});window.addEventListener('pagehide',()=>{if(ready)save()});
async function boot(){try{db=await openDB();if(db){const rec=await db.get(STORE,'auto');if(rec&&rec.state)replaceState(rec.state)}}catch(e){console.warn('存档数据库不可用',e);db=null}ready=true;renderAll();processOffline();checkMilestones();if(!db)toast('存档功能受限','IndexedDB 不可用；请定期导出 JSON 备份。');lastTick=performance.now();requestAnimationFrame(frame)}boot();
})();
