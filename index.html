function exportSave(){const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='one-punch-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importSave(file){try{const parsed=JSON.parse(await file.text()),payload=parsed&&parsed.state&&typeof parsed.state==='object'?parsed.state:parsed;if(!payload||typeof payload!=='object'||!('attack'in payload))throw Error('存档格式不正确');if(!confirm('导入会覆盖当前进度，是否继续？'))return;replaceState(payload);state.lastSaveTime=Date.now();renderAll();saveGame();if(state.offlineClaimPending)showOffline();else E.offlineModal.hidden=true;toast('存档已导入','进度已写入本设备。')}catch(e){alert(`导入失败：${e.message}`)}}
function processClaim(){const reward=state.lastOfflineGold;addGold(reward);state.lastOfflineGold=0;state.lastOfflineSeconds=0;state.offlineClaimPending=false;E.offlineModal.hidden=true;checkMilestones();renderAll();saveGame()}
function triggerShake(now){if(!shakeState)return;const p=(now-shakeState.start)/100;if(p>=1){E.arena.style.transform='';shakeState=null}else{const k=1-p;E.arena.style.transform=`translate(${shakeState.dx*k}px,${shakeState.dy*k}px)`}}
function updateVisuals(now){for(let i=floaties.length-1;i>=0;i--){const f=floaties[i],p=Math.min(1,(now-f.start)/600),rise=64*(1-(1-p)*(1-p));f.n.style.left=`${f.x}px`;f.n.style.top=`${f.y}px`;f.n.style.opacity=String(1-p);f.n.style.transform=`translate(-50%,calc(-50% - ${rise}px)) scale(${1+.1*p})`;if(p>=1){f.n.remove();floaties.splice(i,1)}}for(let i=rings.length-1;i>=0;i--){const r=rings[i],p=Math.min(1,(now-r.start)/230);r.n.style.left=`${r.x}px`;r.n.style.top=`${r.y}px`;r.n.style.opacity=String(1-p);r.n.style.transform=`translate(-50%,-50%) scale(${.2+2*p})`;if(p>=1){r.n.remove();rings.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const q=particles[i],p=Math.min(1,(now-q.start)/q.dur);q.n.style.left=`${q.x}px`;q.n.style.top=`${q.y}px`;q.n.style.opacity=String(1-p);q.n.style.transform=`translate(${q.dx*p}px,${q.dy*p+24*p*p}px) scale(${1-.55*p})`;if(p>=1){q.n.remove();particles.splice(i,1)}}triggerShake(now);renderCombo();renderFight();if(now-lastUi>140){renderButtons();lastUi=now}}
function frame(now){if(document.hidden){lastTick=now;requestAnimationFrame(frame);return}acc+=Math.max(0,(now-lastTick)/1000);lastTick=now;while(acc>=1){tick();acc-=1}updateVisuals(now);requestAnimationFrame(frame)}
E.arena.addEventListener('pointerdown',e=>{e.preventDefault();attackAt(e.clientX,e.clientY)},{passive:false});E.arena.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const r=E.arena.getBoundingClientRect();attackAt(r.left+r.width/2,r.top+r.height/2)}});
E.buyAttack.addEventListener('click',()=>purchase('attack',false));E.allAttack.addEventListener('click',()=>purchase('attack',true));E.buyAuto.addEventListener('click',()=>purchase('auto',false));E.allAuto.addEventListener('click',()=>purchase('auto',true));E.buyGold.addEventListener('click',()=>purchase('gold',false));E.allGold.addEventListener('click',()=>purchase('gold',true));
E.sound.addEventListener('click',()=>{soundOn=!soundOn;E.sound.textContent=soundOn?'🔊':'🔇';E.sound.setAttribute('aria-label',soundOn?'关闭音效':'开启音效');E.sound.setAttribute('aria-pressed',String(soundOn));if(soundOn)playSound('tap')});E.exportButton.addEventListener('click',exportSave);E.importButton.addEventListener('click',()=>E.importFile.click());E.importFile.addEventListener('change',async()=>{const file=E.importFile.files&&E.importFile.files[0];if(file)await importSave(file);E.importFile.value=''});E.claim.addEventListener('click',processClaim);
document.addEventListener('visibilitychange',()=>{if(!ready)return;if(document.hidden){lastTick=performance.now();acc=0;saveGame()}else{lastTick=performance.now();acc=0;applyOffline();renderAll()}});window.addEventListener('pagehide',()=>{if(ready)saveGame()});
async function boot(){try{db=await openDatabase();if(db){const rec=await db.get(STORE,'auto');if(rec&&rec.state)replaceState(rec.state)}}catch(e){console.warn('IndexedDB 初始化失败',e);db=null}ready=true;renderAll();applyOffline();checkMilestones();if(!db)toast('本地存档不可用','请定期导出 JSON 备份。');lastTick=performance.now();requestAnimationFrame(frame)}boot();
})();
</script></body></html>
