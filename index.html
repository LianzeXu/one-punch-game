function addGold(v){v=Math.max(0,Math.floor(v));if(!v)return;state.gold+=v;state.totalGoldEarned+=v;E.gold.classList.remove('goldflash');void E.gold.offsetWidth;E.gold.classList.add('goldflash');setTimeout(()=>E.gold.classList.remove('goldflash'),230)}
function renderHud(){E.gold.textContent=formatNumber(state.gold);E.total.textContent=formatNumber(state.totalGoldEarned);E.attack.textContent=formatNumber(state.attack);E.attackSub.textContent=`暴击 ${Math.round(state.critChance*100)}% · 永久 +${Math.round(state.permanentDamageBonus*100)}%`;E.dps.textContent=formatNumber(autoDPS()*(1+state.permanentDamageBonus));E.dpsSub.textContent=state.autoAttackLevel?`自动 Lv.${formatNumber(state.autoAttackLevel)}`:'未解锁'}
function renderFight(){const lv=Math.floor(state.monstersKilled/10)+1;E.emoji.textContent=state.bossActive?'🐉':state.monsterIsElite?'👹':'👾';E.monsterName.textContent=state.bossActive?'BOSS':state.monsterIsElite?'精英怪':'普通怪';E.level.textContent=state.bossActive?'限时首领':`怪物等级 ${formatNumber(lv)}`;E.monsterStatus.hidden=state.bossActive;E.boss.hidden=!state.bossActive;if(state.bossActive){E.bossTime.textContent=`${formatNumber(state.bossTimerRemaining)} 秒`;E.bossHp.textContent=`${formatNumber(state.bossHP)} / ${formatNumber(state.bossMaxHP)}`;E.bossBar.style.width=`${Math.max(0,100*state.bossHP/Math.max(1,state.bossMaxHP))}%`}else{E.monsterHp.textContent=`${formatNumber(state.monsterHP)} / ${formatNumber(state.monsterMaxHP)}`;E.monsterBar.style.width=`${Math.max(0,100*state.monsterHP/Math.max(1,state.monsterMaxHP))}%`}E.bossCycle.textContent=state.bossActive?'首领战进行中':`下一场 Boss：${clock(state.nextBossIn)}`;const b=`永久伤害 +${Math.round(state.permanentDamageBonus*100)}%`;E.bonusLine.textContent=b;E.bonus.textContent=b}
function renderUpgrades(){const a=costAttack(),next=state.attack<50?state.attack+1:Math.ceil(state.attack*1.1);E.attackTitle.textContent='攻击强化';E.attackEffect.textContent=`攻击 ${formatNumber(state.attack)} → ${formatNumber(next)}（${state.attack<50?'+1':'约 +10%'}）`;E.attackCost.textContent=`${formatNumber(a)} 🪙`;E.upAttack.disabled=state.gold<a||Date.now()<(state.upgradeCooldownUntil.attack||0);const c=costCrit(),max=state.critChance>=.25-1e-9;E.critTitle.textContent=max?'暴击已满级':'强化暴击';E.critEffect.textContent=`暴击率 ${Math.round(state.critChance*100)}% → ${Math.round(Math.min(.25,state.critChance+.02)*100)}%`;E.critCost.textContent=max?'MAX':`${formatNumber(c)} 🪙`;E.upCrit.disabled=max||state.gold<c||Date.now()<(state.upgradeCooldownUntil.crit||0);const ac=costAuto(),nl=state.autoAttackLevel+1;E.autoTitle.textContent=state.autoAttackLevel?'升级自动攻击':'解锁自动攻击';E.autoEffect.textContent=state.autoAttackLevel?`Lv.${formatNumber(state.autoAttackLevel)} → Lv.${formatNumber(nl)} · DPS ${formatNumber(autoDPS())} → ${formatNumber(state.attack*.5*nl)}`:`解锁后 DPS ${formatNumber(state.attack*.5)}`;E.autoCost.textContent=`${formatNumber(ac)} 🪙`;E.upAuto.disabled=state.gold<ac||Date.now()<(state.upgradeCooldownUntil.auto||0)}
function renderRage(){const now=Date.now(),on=now<state.rageUntil;E.app.classList.toggle('rage',on);E.combo.classList.toggle('raging',on);E.combo.textContent=on?`暴怒 ×2 · ${Math.max(1,Math.ceil((state.rageUntil-now)/1000))}秒`:`连击 ${formatNumber(state.comboCount)}/10`}function renderAll(){renderHud();renderFight();renderUpgrades();renderRage()}
function floatText(x,y,text,crit,rage){const n=document.createElement('div');n.className='float'+(crit?' crit':'')+(rage?' rage':'');n.textContent=text;E.floats.appendChild(n);floaties.push({n,x:Math.max(20,Math.min(innerWidth-20,x)),y:Math.max(24,Math.min(innerHeight-24,y)),start:performance.now()})}function shakeScreen(){const a=2+Math.random()*2;shake={start:performance.now(),dx:(Math.random()<.5?-1:1)*a,dy:(Math.random()<.5?-1:1)*a}}
function visualFrame(now){for(let i=floaties.length-1;i>=0;i--){const f=floaties[i],p=Math.min(1,(now-f.start)/600),rise=68*(1-(1-p)**2);f.n.style.left=`${f.x}px`;f.n.style.top=`${f.y}px`;f.n.style.opacity=String(1-p);f.n.style.transform=`translate(-50%,calc(-50% - ${rise}px)) scale(${1+.12*p})`;if(p>=1){f.n.remove();floaties.splice(i,1)}}if(shake){const p=(now-shake.start)/100;if(p>=1){E.battle.style.transform='';shake=null}else E.battle.style.transform=`translate(${shake.dx*(1-p)}px,${shake.dy*(1-p)}px)`}renderRage();renderFight();if(now-lastUI>120){renderUpgrades();lastUI=now}}
function flash(b){b.classList.remove('success');void b.offsetWidth;b.classList.add('success');setTimeout(()=>b.classList.remove('success'),230)}function buy(k){const now=Date.now(),c=k==='attack'?costAttack():k==='crit'?costCrit():costAuto();if(state.gold<c||now<(state.upgradeCooldownUntil[k]||0)||(k==='crit'&&state.critChance>=.25-1e-9))return;state.gold-=c;if(k==='attack')state.attack=state.attack<50?state.attack+1:Math.ceil(state.attack*1.1);else if(k==='crit')state.critChance=Math.min(.25,Number((state.critChance+.02).toFixed(4)));else state.autoAttackLevel++;state.upgradeCooldownUntil[k]=now+260;flash(k==='attack'?E.upAttack:k==='crit'?E.upCrit:E.upAuto);checkMilestones();renderAll();save()}
function baseHP(){return Math.max(1,Math.floor(10*Math.pow(1.35,Math.floor(state.monstersKilled/10))))}function spawnMonster(){const elite=state.elitePending;state.elitePending=false;state.monsterIsElite=elite;state.monsterMaxHP=baseHP()*(elite?3:1);state.monsterHP=state.monsterMaxHP}function defeatMonster(){const elite=state.monsterIsElite;addGold(state.monsterMaxHP*(elite?5:1));state.monstersKilled++;if(!elite&&++state.normalKillsSinceElite>=10){state.normalKillsSinceElite=0;state.elitePending=true}spawnMonster();checkMilestones()}
function autoDamage(){const damage=autoDPS()*(1+state.permanentDamageBonus);if(damage<=0)return;if(state.bossActive){state.bossHP=Math.max(0,state.bossHP-damage);if(state.bossHP<=0)finishBoss(true)}else{state.monsterHP-=damage;if(state.monsterHP<=0)defeatMonster()}}
function showBanner(t,s,d=2200){clearTimeout(bannerTimer);E.bannerText.textContent=t;E.bannerSub.textContent=s;E.banner.hidden=false;bannerTimer=setTimeout(()=>E.banner.hidden=true,d)}function startBoss(){state.bossActive=true;const power=autoDPS()||state.attack;state.bossMaxHP=Math.max(100,Math.floor(power*30*1.2));state.bossHP=state.bossMaxHP;state.bossTimerRemaining=30;showBanner('BOSS 来袭！','限时 30 秒，点击继续出拳',1300);renderAll()}function finishBoss(win){if(!state.bossActive)return;state.bossActive=false;state.bossTimerRemaining=0;state.bossHP=0;state.nextBossIn=300;if(win){state.bossKills++;state.permanentDamageBonus+=.1;showBanner('Boss 击破！永久伤害 +10%','伤害加成永久生效',2400)}else showBanner('Boss 时间到','没有惩罚，300 秒后再次挑战');checkMilestones();renderAll();save()}
function tick(){state.totalPlaySeconds++;if(state.bossActive){autoDamage();if(state.bossActive){state.bossTimerRemaining=Math.max(0,state.bossTimerRemaining-1);if(state.bossTimerRemaining===0)finishBoss(false)}}else{autoDamage();if(!state.bossActive&&--state.nextBossIn<=0){state.nextBossIn=0;startBoss()}}checkMilestones();renderAll();if(state.totalPlaySeconds%10===0)save()}
function comboHit(){const now=Date.now(),raging=now<state.rageUntil;if(!raging){if(state.lastClickTime&&now-state.lastClickTime>1500)state.comboCount=0;state.comboCount++;if(state.comboCount>=10){if(now>=state.rageCooldownUntil){state.comboCount=0;state.rageUntil=now+RAGE;state.rageCooldownUntil=now+COOLDOWN;state.rageTriggers++;if(state.rageTriggers===1)checkMilestones();else toast('暴怒启动','接下来 5 秒点击伤害 ×2');save()}else state.comboCount=9}}state.lastClickTime=now;return raging}
// iOS Safari 不支持 Vibration API；若由 WKWebView 宿主注册 hapticFeedback 消息处理器，则走原生触感反馈桥接。
function triggerHaptic(kind='tap'){
  try{
    const handler=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.hapticFeedback;
    if(handler&&typeof handler.postMessage==='function'){handler.postMessage(kind);return true;}
  }catch(e){}
  try{
    if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function'){
      const patterns={tap:10,rage:18,critical:[12,18,32]};
      return navigator.vibrate(patterns[kind]||patterns.tap);
    }
  }catch(e){}
  return false;
}
function attackAt(x,y){const rage=comboHit(),crit=Math.random()<state.critChance,dmg=state.attack*(1+state.permanentDamageBonus)*(crit?3:1)*(rage?2:1);triggerHaptic(crit?'critical':rage?'rage':'tap');state.highestSingleHit=Math.max(state.highestSingleHit,dmg);floatText(x,y,`${rage?'暴怒 ':''}${crit?'暴击 ':''}${formatNumber(dmg)}`,crit,rage);if(crit)shakeScreen();if(state.bossActive){state.bossHP=Math.max(0,state.bossHP-dmg);if(state.bossHP<=0)finishBoss(true)}else{state.monsterHP-=dmg;if(state.monsterHP<=0)defeatMonster()}checkMilestones();renderAll()}
function showOffline(){if(!state.offlineClaimPending||state.lastOfflineGold<=0)return;E.offlineText.textContent=`离线 ${offlineDuration(state.lastOfflineSeconds)}，获得以下金币。`;E.offlineGold.textContent=`${formatNumber(state.lastOfflineGold)} 🪙`;E.offline.hidden=false}function processOffline(){const now=Date.now(),secs=Math.max(0,Math.floor((now-state.lastSaveTime)/1000));if(secs>30&&autoDPS()>0){const elapsed=Math.min(secs,MAX_OFFLINE),gain=Math.floor(autoDPS()*elapsed*.5);if(gain>0){if(!state.offlineClaimPending){state.lastOfflineGold=0;state.lastOfflineSeconds=0}state.lastOfflineGold+=gain;state.lastOfflineSeconds+=elapsed;state.offlineClaimPending=true}}state.lastSaveTime=now;if(state.offlineClaimPending)showOffline();save()}
function exportSave(){const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='one-punch-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importSave(file){try{const parsed=JSON.parse(await file.text()),data=parsed&&parsed.state&&typeof parsed.state==='object'?parsed.state:parsed;if(!data||typeof data!=='object'||!('attack'in data))throw Error('文件中没有有效游戏状态');if(!confirm('导入会覆盖当前进度，确定继续吗？'))return;replaceState(data);state.lastSaveTime=Date.now();renderAll();save();checkMilestones();if(state.offlineClaimPending)showOffline();else E.offline.hidden=true;toast('导入成功','存档已载入并保存到本设备。')}catch(e){alert(`无法导入存档：${e.message}`)}}
function frame(now){if(document.hidden){lastTick=now;requestAnimationFrame(frame);return}acc+=Math.max(0,(now-lastTick)/1000);lastTick=now;while(acc>=1){tick();acc-=1}visualFrame(now);requestAnimationFrame(frame)}
E.battle.addEventListener('pointerdown',e=>{e.preventDefault();attackAt(e.clientX,e.clientY)},{passive:false});E.battle.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const r=E.battle.getBoundingClientRect();attackAt(r.left+r.width/2,r.top+r.height/2)}});E.upAttack.addEventListener('click',()=>buy('attack'));E.upCrit.addEventListener('click',()=>buy('crit'));E.upAuto.addEventListener('click',()=>buy('auto'));$('#export').addEventListener('click',exportSave);$('#import').addEventListener('click',()=>$('#file').click());$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(f)await importSave(f);e.target.value=''});$('#claim').addEventListener('click',()=>{const g=state.lastOfflineGold;addGold(g);state.lastOfflineGold=0;state.lastOfflineSeconds=0;state.offlineClaimPending=false;E.offline.hidden=true;checkMilestones();renderAll();save()});
document.addEventListener('visibilitychange',()=>{if(!ready)return;if(document.hidden){lastTick=performance.now();acc=0;save()}else{lastTick=performance.now();acc=0;processOffline();renderAll()}});window.addEventListener('pagehide',()=>{if(ready)save()});
async function boot(){try{db=await openDB();if(db){const rec=await db.get(STORE,'auto');if(rec&&rec.state)replaceState(rec.state)}}catch(e){console.warn('存档数据库不可用',e);db=null}ready=true;renderAll();processOffline();checkMilestones();if(!db)toast('存档功能受限','IndexedDB 不可用；请定期导出 JSON 备份。');lastTick=performance.now();requestAnimationFrame(frame)}boot();
})();
</script></body></html>
